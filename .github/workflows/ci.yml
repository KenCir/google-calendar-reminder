name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.3
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'pnpm'
      - name: Install build tools
        run: sudo apt-get install -y python3 make g++ && npm install -g node-gyp
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: lint check
        run: pnpm lint
